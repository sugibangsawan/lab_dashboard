[project]
name = "lab-dashboard"
version = "0.1.0"
description = "Lab water-quality dashboard for Unit D ponds"
readme = "README.md"
authors = [
    { name = "sugiharto", email = "sugihartobangsawan@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.2",
    "plotly>=6.0",
    "streamlit>=1.40",
]

[project.scripts]
lab-dashboard = "lab_dashboard:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
